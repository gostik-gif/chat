<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web — Семейный чат</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0c1317;
            --bg-side: #111b21;
            --bg-chat: #0b141a;
            --header-bg: #202c33;
            --incoming-msg: #202c33;
            --outgoing-msg: #005c4b;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --accent: #00a884;
            --accent-hover: #06cf9c;
            --border-color: #222d34;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #111b21;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Login Screen */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 20, 26, 0.95);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: #202c33;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .user-select {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .user-btn-choice {
            flex: 1;
            padding: 12px 8px;
            background: #111b21;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .user-btn-choice.active {
            border-color: var(--accent);
            background: #182229;
        }

        .user-btn-choice i {
            font-size: 24px;
            color: var(--accent);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            background: #111b21;
            border: 1px solid var(--border-color);
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .login-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #111;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-submit:hover {
            background: var(--accent-hover);
        }

        /* App Main */
        .app-container {
            width: 100vw;
            height: 100vh;
            max-width: 1600px;
            display: flex;
            background-color: var(--bg-side);
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        .sidebar {
            width: 380px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-side);
        }

        .user-header {
            height: 60px;
            background-color: var(--header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            font-weight: bold;
            font-size: 18px;
        }

        .sidebar-actions {
            display: flex;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: 0.2s;
        }

        .chat-item:hover {
            background-color: #202c33;
        }

        .chat-item.active {
            background-color: #2a3942;
        }

        .chat-details {
            margin-left: 15px;
            flex: 1;
        }

        .chat-title-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 500;
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .chat-last-msg {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        /* Chat Window */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-chat);
            position: relative;
        }

        .chat-header {
            height: 60px;
            background-color: var(--header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .messages-container {
            flex: 1;
            padding: 20px 5%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
        }

        .msg {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
        }

        .msg-incoming {
            background-color: var(--incoming-msg);
            align-self: flex-start;
        }

        .msg-outgoing {
            background-color: var(--outgoing-msg);
            align-self: flex-end;
        }

        .msg-author {
            font-size: 11px;
            font-weight: bold;
            color: #53bdeb;
            margin-bottom: 2px;
        }

        .msg-time {
            font-size: 10px;
            color: var(--text-secondary);
            float: right;
            margin-top: 4px;
            margin-left: 10px;
        }

        .msg-outgoing .msg-time {
            color: rgba(255, 255, 255, 0.6);
        }

        .chat-footer {
            height: 62px;
            background-color: var(--header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .input-box {
            flex: 1;
            background-color: #2a3942;
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--text-primary);
            border: none;
            outline: none;
            font-size: 15px;
        }

        .footer-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .footer-btn.recording {
            color: #ea4335;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .file-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            margin-top: 5px;
        }

        .voice-msg-player {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 20px;
            min-width: 180px;
        }

        /* Modal for New Chat */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: #202c33;
            padding: 24px;
            border-radius: 10px;
            width: 320px;
        }

        .modal-card h3 {
            margin-bottom: 15px;
            color: var(--accent);
        }

        .member-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Login Modal -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-card">
        <h2><i class="fa-brands fa-whatsapp"></i> Вход в систему</h2>
        <div class="user-select">
            <div class="user-btn-choice active" onclick="selectUser('papa')" id="u-papa">
                <i class="fa-solid fa-user-tie"></i>
                Папа
            </div>
            <div class="user-btn-choice" onclick="selectUser('mama')" id="u-mama">
                <i class="fa-solid fa-user-nurse"></i>
                Мама
            </div>
            <div class="user-btn-choice" onclick="selectUser('artem')" id="u-artem">
                <i class="fa-solid fa-user-graduate"></i>
                Артем
            </div>
        </div>
        <div class="input-group">
            <label>Пароль доступа</label>
            <input type="password" class="input-field" id="loginPass" placeholder="Введите пароль (1234)">
        </div>
        <button class="login-submit" onclick="doLogin()">Войти</button>
        <div style="font-size: 11px; color: var(--text-secondary); margin-top: 15px;">
            Тестовый пароль для всех пользователей: <b>1234</b>
        </div>
    </div>
</div>

<!-- New Chat Modal -->
<div class="modal" id="newChatModal">
    <div class="modal-card">
        <h3>Создать диалог</h3>
        <div id="membersList"></div>
        <div style="margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px;">
            <button class="login-submit" style="background: #444; color: #fff; width: auto;" onclick="closeModal()">Отмена</button>
            <button class="login-submit" style="width: auto;" onclick="confirmNewChat()">Создать</button>
        </div>
    </div>
</div>

<!-- Main Container -->
<div class="app-container">
    <div class="sidebar">
        <div class="user-header">
            <div class="user-info-head">
                <div class="avatar" id="myAvatar">?</div>
                <div>
                    <div id="myTitle" style="font-weight: bold; font-size: 15px;">-</div>
                    <div style="font-size: 11px; color: var(--accent);">+7 771 522 06 75</div>
                </div>
            </div>
            <div class="sidebar-actions">
                <i class="fa-solid fa-plus" title="Новый чат" onclick="openNewChatModal()"></i>
                <i class="fa-solid fa-right-from-bracket" title="Выход" onclick="location.reload()"></i>
            </div>
        </div>

        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="avatar" id="activeChatAvatar">C</div>
                <div>
                    <div id="activeChatTitle" style="font-weight: 500;">Выберите чат</div>
                    <div id="activeChatMembers" style="font-size: 12px; color: var(--text-secondary);"></div>
                </div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="chat-footer">
            <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
            <button class="footer-btn" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-paperclip"></i></button>
            
            <input type="text" class="input-box" id="msgInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendTextMessage()">
            
            <button class="footer-btn" id="micBtn" onclick="toggleVoiceRecord()"><i class="fa-solid fa-microphone"></i></button>
            <button class="footer-btn" style="color: var(--accent);" onclick="sendTextMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    const USERS = {
        papa: { name: "Папа", pass: "1234", avatar: "👨" },
        mama: { name: "Мама", pass: "1234", avatar: "👩" },
        artem: { name: "Артем (Dev)", pass: "1234", avatar: "👨‍💻" }
    };

    let currentUserKey = 'papa';
    let activeChatId = null;
    let isRecording = false;
    let recordTimer = null;
    let recordSeconds = 0;

    // Default Chats Database
    let chats = [
        {
            id: 'family',
            title: 'Семейный Чат',
            members: ['papa', 'mama', 'artem'],
            messages: [
                { sender: 'artem', text: 'Привет! Я создаю веб-приложение для семьи!', time: '12:00' },
                { sender: 'mama', text: 'Молодец, Артем! Отличная работа!', time: '12:02' }
            ]
        },
        {
            id: 'artem_papa',
            title: 'Артем & Папа',
            members: ['papa', 'artem'],
            messages: [
                { sender: 'artem', text: 'Папа, смотри какой новый код написал.', time: '11:30' },
                { sender: 'papa', text: 'Отлично, давай разберем вечерком!', time: '11:35' }
            ]
        }
    ];

    function selectUser(key) {
        currentUserKey = key;
        document.querySelectorAll('.user-btn-choice').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`u-${key}`).classList.add('active');
    }

    function doLogin() {
        const pass = document.getElementById('loginPass').value;
        if (pass === USERS[currentUserKey].pass) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('myAvatar').innerText = USERS[currentUserKey].avatar;
            document.getElementById('myTitle').innerText = USERS[currentUserKey].name;
            renderChatList();
            if (chats.length > 0) selectChat(chats[0].id);
        } else {
            alert('Неверный пароль!');
        }
    }

    function renderChatList() {
        const container = document.getElementById('chatList');
        container.innerHTML = '';

        chats.filter(c => c.members.includes(currentUserKey)).forEach(chat => {
            const div = document.createElement('div');
            div.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
            div.onclick = () => selectChat(chat.id);

            const lastMsg = chat.messages[chat.messages.length - 1];
            const lastMsgText = lastMsg ? (lastMsg.text || 'Медиафайл') : 'Нет сообщений';
            const lastMsgTime = lastMsg ? lastMsg.time : '';

            div.innerHTML = `
                <div class="avatar">${chat.title.charAt(0)}</div>
                <div class="chat-details">
                    <div class="chat-title-row">
                        <span class="chat-name">${chat.title}</span>
                        <span class="chat-time">${lastMsgTime}</span>
                    </div>
                    <div class="chat-last-msg">${lastMsgText}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function selectChat(id) {
        activeChatId = id;
        renderChatList();
        
        const chat = chats.find(c => c.id === id);
        document.getElementById('activeChatTitle').innerText = chat.title;
        document.getElementById('activeChatAvatar').innerText = chat.title.charAt(0);
        
        const memberNames = chat.members.map(m => USERS[m].name).join(', ');
        document.getElementById('activeChatMembers').innerText = `Участники: ${memberNames}`;

        renderMessages();
    }

    function renderMessages() {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';

        const chat = chats.find(c => c.id === activeChatId);
        if (!chat) return;

        chat.messages.forEach(m => {
            const isMe = m.sender === currentUserKey;
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isMe ? 'msg-outgoing' : 'msg-incoming'}`;

            let bodyHtml = '';
            if (!isMe) {
                bodyHtml += `<div class="msg-author">${USERS[m.sender].name}</div>`;
            }

            if (m.text) bodyHtml += `<div>${m.text}</div>`;
            if (m.file) {
                if (m.file.type.startsWith('image/')) {
                    bodyHtml += `<div class="file-preview"><img src="${m.file.url}" alt="photo"></div>`;
                } else {
                    bodyHtml += `<div style="margin-top:5px;"><i class="fa-solid fa-file"></i> ${m.file.name}</div>`;
                }
            }
            if (m.voice) {
                bodyHtml += `
                    <div class="voice-msg-player">
                        <i class="fa-solid fa-play" style="cursor:pointer;"></i>
                        <span style="font-size:12px;">Голосовое (${m.voice.duration}s)</span>
                    </div>
                `;
            }

            bodyHtml += `<span class="msg-time">${m.time}</span>`;
            msgDiv.innerHTML = bodyHtml;
            container.appendChild(msgDiv);
        });

        container.scrollTop = container.scrollHeight;
    }

    function sendTextMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !activeChatId) return;

        const chat = chats.find(c => c.id === activeChatId);
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        chat.messages.push({
            sender: currentUserKey,
            text: text,
            time: time
        });

        input.value = '';
        renderMessages();
        renderChatList();
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file || !activeChatId) return;

        const reader = new FileReader();
        reader.onload = function (evt) {
            const chat = chats.find(c => c.id === activeChatId);
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            chat.messages.push({
                sender: currentUserKey,
                file: { name: file.name, type: file.type, url: evt.target.result },
                time: time
            });
            renderMessages();
            renderChatList();
        };
        reader.readAsDataURL(file);
    }

    function toggleVoiceRecord() {
        const btn = document.getElementById('micBtn');
        if (!isRecording) {
            isRecording = true;
            btn.classList.add('recording');
            recordSeconds = 0;
            recordTimer = setInterval(() => { recordSeconds++; }, 1000);
        } else {
            isRecording = false;
            btn.classList.remove('recording');
            clearInterval(recordTimer);

            const chat = chats.find(c => c.id === activeChatId);
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            chat.messages.push({
                sender: currentUserKey,
                voice: { duration: recordSeconds || 1 },
                time: time
            });
            renderMessages();
            renderChatList();
        }
    }

    function openNewChatModal() {
        const container = document.getElementById('membersList');
        container.innerHTML = '';

        Object.keys(USERS).forEach(k => {
            if (k !== currentUserKey) {
                container.innerHTML += `
                    <label class="member-checkbox">
                        <input type="checkbox" value="${k}" class="new-chat-user-check">
                        ${USERS[k].avatar} ${USERS[k].name}
                    </label>
                `;
            }
        });

        document.getElementById('newChatModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('newChatModal').style.display = 'none';
    }

    function confirmNewChat() {
        const selected = Array.from(document.querySelectorAll('.new-chat-user-check:checked')).map(el => el.value);
        if (selected.length === 0) return alert('Выберите хотя бы одного участника');

        selected.push(currentUserKey);
        const title = selected.map(k => USERS[k].name).join(' & ');
        const id = 'chat_' + Date.now();

        chats.push({
            id: id,
            title: title,
            members: selected,
            messages: []
        });

        closeModal();
        selectChat(id);
    }
</script>
</body>
</html>
